name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: sh -n assets/backend/voltset.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning assets/backend/voltset.sh || true

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build vsetns
        run: gcc -O2 -static -s -o /tmp/vsetns src/vsetns.c && file /tmp/vsetns
